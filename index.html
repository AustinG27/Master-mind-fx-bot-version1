h1{font-family:Michroma,"Exo 2",sans-serif;font-weight:400;font-size:18px;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin:0;text-shadow:0 0 14px rgba(63,216,255,.7)}
.sub{text-align:center;color:var(--cyan);margin:4px 0 24px;font-size:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600;margin-bottom:16px}
input[type=text],input[type=password]{font:inherit;color:var(--text);background:rgba(2,6,14,.85);border:1px solid var(--line);border-radius:3px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.keep{display:flex;align-items:center;gap:10px;font-weight:400;color:var(--muted)}

<script>
(async()=>{
  "use strict";
  const P=JSON.parse(document.getElementById("payload").textContent),SESSION="mmfx_session_v1";
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),enc=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
  const msg=document.getElementById("msg"),go=document.getElementById("go");
  if(!window.crypto||!crypto.subtle){msg.className="bad";msg.textContent="This browser can't open the tool. Use a recent Chrome, Edge, Safari or Firefox over https.";go.disabled=true;return;}
  async function derive(user,pass){
    const mat=await crypto.subtle.importKey("raw",new TextEncoder().encode(user.trim().toLowerCase()+":"+pass),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},mat,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function unlock(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data)));}
  function show(html){document.open();document.write(html);document.close();}
  // signed in before on this device?
  try{const s=JSON.parse(localStorage.getItem(SESSION)||"null");
    if(s&&s.salt===P.salt){const key=await crypto.subtle.importKey("raw",b64(s.k),{name:"AES-GCM"},false,["decrypt"]);show(await unlock(key));return;}
    if(s)localStorage.removeItem(SESSION);}catch(e){try{localStorage.removeItem(SESSION);}catch(_){}}
  document.getElementById("u").focus();
  document.getElementById("f").addEventListener("submit",async e=>{
    e.preventDefault();go.disabled=true;msg.className="";msg.textContent="Signing in…";
    try{const key=await derive(document.getElementById("u").value,document.getElementById("p").value),html=await unlock(key);
      if(document.getElementById("k").checked){try{localStorage.setItem(SESSION,JSON.stringify({salt:P.salt,k:enc(await crypto.subtle.exportKey("raw",key))}));}catch(_){}}
      show(html);}
    catch(err){go.disabled=false;msg.className="bad";msg.textContent="Wrong username or password.";document.getElementById("p").select();}
  });
})();
</script>

</html>
